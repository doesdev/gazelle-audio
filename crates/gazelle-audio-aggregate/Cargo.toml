[package]
name = "gazelle-audio-aggregate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Gazelle Aggregate: one audio driver that opens several Antelope drivers underneath"

[lib]
name = "gazelle_aggregate"
crate-type = ["cdylib", "rlib"]

[dependencies]
gazelle-audio-stream-abi = { path = "../gazelle-audio-stream-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
