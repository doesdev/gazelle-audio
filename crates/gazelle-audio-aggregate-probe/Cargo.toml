[package]
name = "gazelle-audio-aggregate-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Phase 0 coexistence probe: opens two ASIO drivers in one process and counts their callbacks"

[dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
] }
