[package]
name = "gazelle-audio-stream-abi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The low latency audio driver interface's types and vtable, declared by hand, plus the registry it is published in"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
] }
