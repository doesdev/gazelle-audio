[package]
name = "gazelle-audio-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# `gazelle-audio-serverw` is the same server without a console window (src/bin); `cargo run`
# means this one.
default-run = "gazelle-audio-server"
description = "Multi-device HTTP/WebSocket control server for Antelope Audio interfaces"

[dependencies]
# The devices are HID-class, so Windows claims them exclusively and raw USB cannot bind them
# (reference/usb-access.md). `windows-native` is hidapi's Rust backend, so no C toolchain is
# needed; macOS and Linux backends are selected per platform when those are built.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
gazelle-audio-protocol = { path = "../gazelle-audio-protocol" }
gazelle-audio-transport = { path = "../gazelle-audio-transport" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path", "mime-guess"] }
# The in-app updater. A release source must be HTTPS, so unlike `drive` (decision A35's
# plain-HTTP note) this binary compiles TLS in: rustls with the ring provider, A35's choice.
# `ureq` rather than `reqwest`, which the capture crate uses: it is the smaller tree (no hyper, no
# encoding_rs) for one GET at a time. Default features off leaves out `platform-verifier`, so
# certificates verify against ureq's bundled webpki roots rather than the OS store; see
# `update/mod.rs`.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# Signature checking only; no signing in the shipped binary. `xtask` does the signing.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
semver = "1"

# The desktop window, behind the `window` feature: Tao makes the window, Wry puts the system
# webview (WebView2 on Windows) in it and points it at this server. Used directly, not through
# Tauri: the UI talks HTTP and WS to a server we already run, so Tauri's IPC and build pipeline
# would buy nothing (`specs/2026-09-18-shipping-portable.md`). Both are optional, and their trees
# are part of what CI's Rust 1.88 build covers; see `reference/rust-crates.md`.
tao = { version = "0.36", optional = true }
wry = { version = "0.56", optional = true }

# The tray icon, on Win32 directly. `hidapi` already brings in this exact crate, so the tray adds
# features, not packages.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The audio driver's API DLL is told apart by its version resource (`driver/windows.rs`).
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["web-ui"]
# Serve the built web UI from the binary. Needs no Node at build time: when
# web/apps/web/dist is missing, a notice page is embedded instead.
web-ui = ["dep:rust-embed"]
# A window of its own over the served UI. Off by default: the headless server and every test
# harness that runs it with `--no-tray` are untouched by it. The shipped app is built with it.
window = ["dep:tao", "dep:wry"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
