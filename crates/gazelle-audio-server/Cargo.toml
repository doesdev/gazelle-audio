[package]
name = "gazelle-audio-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# `gazelle-audio-serverw` is the same server without a console window (src/bin); `cargo run`
# means this one.
default-run = "gazelle-audio-server"
description = "Multi-device HTTP/WebSocket control server for Antelope Audio interfaces"

[dependencies]
# The devices are HID-class, so Windows claims them exclusively and raw USB cannot bind them
# (reference/usb-access.md). `windows-native` is hidapi's Rust backend, so no C toolchain is
# needed; macOS and Linux backends are selected per platform when those are built.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
gazelle-audio-protocol = { path = "../gazelle-audio-protocol" }
gazelle-audio-transport = { path = "../gazelle-audio-transport" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "~4.5.61", features = ["derive"] }
futures-util = "0.3"
rust-embed = { version = "=8.11.0", optional = true, features = ["interpolate-folder-path", "mime-guess"] }

# The desktop window, behind the `window` feature: Tao makes the window, Wry puts the system
# webview (WebView2 on Windows) in it and points it at this server. Used directly, not through
# Tauri: the UI talks HTTP and WS to a server we already run, so Tauri's IPC and build pipeline
# would buy nothing (`specs/2026-09-18-shipping-portable.md`). Both are optional, and their trees
# are audited against the Rust floor separately — see `reference/rust-crates.md`.
tao = { version = "0.36", optional = true }
wry = { version = "0.56", optional = true }

# The tray icon, on Win32 directly. `hidapi` already brings in this exact crate, so the tray adds
# features, not packages, to what the Rust floor audit covers.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["web-ui"]
# Serve the built web UI from the binary. Needs no Node at build time: when
# web/apps/web/dist is missing, a notice page is embedded instead.
web-ui = ["dep:rust-embed"]
# A window of its own over the served UI. Off by default: the headless server, every test harness
# that runs it with `--no-tray`, and the Rust floor audit's default answer are untouched by it.
window = ["dep:tao", "dep:wry"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
