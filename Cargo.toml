[workspace]
resolver = "2"
members = [
    "crates/gazelle-audio-protocol",
    "crates/gazelle-audio-transport",
    "crates/gazelle-audio-server",
    "crates/gazelle-audio-capture",
    # The audio driver interface itself, declared by hand and shared by the two crates below.
    "crates/gazelle-audio-stream-abi",
    # Phase 0 of the aggregate driver: a hardware probe, never shipped.
    "crates/gazelle-audio-aggregate-probe",
    # Phase 1 of the aggregate driver: the driver itself. It ships inside the server's
    # executables, embedded at release build time; see `docs/releasing.md`.
    "crates/gazelle-audio-aggregate",
    # Phase 2: the record the driver publishes its state in and Gazelle reads. Shared by both, so
    # that neither has to depend on the other.
    "crates/gazelle-audio-aggregate-status",
    # Measuring what the aggregate has left over: drives the aggregate at real converters and
    # works out the trim that lines the interfaces up. Linked into the server for the Aggregate
    # page's Measure and Check.
    "crates/gazelle-audio-calibrate",
    # Release chores (SHA256SUMS and its signature). Never shipped.
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT"
# What the product needs: the shipped app is the `window` build, whose `wry` -> `url` -> ICU tree
# declares 1.88, and the capture crate's `rmcp` does too. CI's msrv job builds everything with a
# real Rust 1.88.0, which catches a dependency update that lifts the floor. Developed on current stable.
rust-version = "1.88"
