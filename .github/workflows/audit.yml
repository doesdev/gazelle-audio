# Weekly: the Rust dependency tree against the RustSec advisory database. `cargo audit` reads
# Cargo.lock only and builds nothing, so it runs on Linux. Run it by hand from the Actions tab
# after a dependency change if a week is too long to wait, or: gh workflow run audit.yml

name: Audit

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
