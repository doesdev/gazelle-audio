# The checks every change must pass: the Rust workspace, the Rust version floor, the web app and
# its end-to-end suite, the docs, and a secret scan of what changed.
#
# Windows only, as the product is. No job opens a device: GAZELLE_NO_HARDWARE makes any server
# refuse the USB backend, and every harness passes --backend loopback as well.
#
# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot (.github/dependabot.yml) keeps them current.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAZELLE_NO_HARDWARE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # corepack fetches the pnpm that web/package.json names; it must not stop to ask.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The window feature compiles
        run: cargo check -p gazelle-audio-server --features window --locked
      # `cargo fmt --check` is deliberately absent: the tree has never been formatted with
      # rustfmt's defaults, and reformatting it is its own decision.

  msrv:
    name: Rust version floor
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # The toolchain floor: the workspace declares 1.88, what the
      # shipped app (the window build, through wry's url and ICU tree) and the capture crate
      # (rmcp) need. A real build on that toolchain is the gate: it is what catches a dependency
      # update that lifts the floor, including an edition Cargo 1.88 cannot parse.
      - name: Rust 1.88 builds the workspace, the window and the capture crate
        run: |
          cargo +1.88.0 build --locked --workspace
          cargo +1.88.0 check --locked -p gazelle-audio-server --features window

  web:
    name: Web tests, e2e and docs
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm, through corepack
        run: |
          corepack enable
          pnpm --version
      # The integration tests and the e2e suite build and run the real server.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: Where pnpm keeps its store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        working-directory: web
        run: pnpm test
      - name: pnpm build
        working-directory: web
        run: pnpm build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Playwright's Chromium
        working-directory: web
        run: pnpm exec playwright install chromium
      - name: pnpm e2e
        working-directory: web
        run: pnpm e2e
      - name: pnpm docs:check
        working-directory: web
        run: pnpm docs:check
      # Always, not only on failure: a test that failed and then passed on a retry is flaky, and
      # its first attempt's trace is the only record of why. Nothing is uploaded on a clean run.
      - name: Keep the e2e traces and screenshots of a failure or a flake
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secret scan of the change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pre-commit hook itself, over what this push or pull request changes. A new branch's
      # first push has no "before", so it is scanned against its parent commit.
      - name: Scan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "scanning $base..HEAD"
          bash .githooks/pre-commit --range "$base"
