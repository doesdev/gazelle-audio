# Weekly dependency updates, grouped so each ecosystem is at most one pull request a week.
#
# Cargo: an update can lift the Rust 1.82 floor that everything built by default must build on
# (.agent/reference/rust-crates.md, "Toolchain floor"). The msrv job in ci.yml is what catches it,
# so read its result before merging a cargo update. The pins that hold the floor today are
# ignored here, so Dependabot does not propose undoing them week after week; lifting any of them
# is a decision about the floor, made by hand.
#
# npm: web/ is a pnpm workspace (pnpm-lock.yaml); Dependabot's npm ecosystem reads pnpm lockfiles.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Each of these declares a newer Rust than 1.82 from the version named on.
      - dependency-name: clap
        versions: [">= 4.6.0"]
      - dependency-name: clap_lex
        versions: [">= 1.1.0"]
      - dependency-name: rust-embed
        versions: ["> 8.11.0"]
      - dependency-name: ureq
        versions: [">= 3.2.0"]
      - dependency-name: zeroize
        versions: [">= 1.9.0"]
      # Edition 2024 from 1.8.0, which Cargo 1.82 cannot parse even though nothing enables it
      # (it sits behind ed25519's unused pkcs8 feature); pinned in Cargo.lock only.
      - dependency-name: base64ct
        versions: [">= 1.8.0"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The Node types follow the Node we run (24, engines in web/package.json); raise them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A TypeScript major (7 is the native compiler) is its own change, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
