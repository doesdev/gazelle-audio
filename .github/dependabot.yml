# Weekly dependency updates, grouped so each ecosystem is at most one pull request a week.
#
# Cargo: an update can lift the Rust 1.88 floor the workspace declares. Nothing is held back for it: the msrv job in ci.yml builds the workspace with a real
# Rust 1.88.0, so read its result before merging a cargo update.
#
# npm: web/ is a pnpm workspace (pnpm-lock.yaml); Dependabot's npm ecosystem reads pnpm lockfiles.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    # No floor pins to ignore: the msrv job at 1.88 is what catches an update that lifts it.

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The Node types follow the Node we run: 24, the Active LTS (CI's node-version). Node 26
      # becomes the Active LTS on 2026-10-28; after that, move Node and @types/node to 26
      # together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
