# Weekly dependency updates, grouped so each ecosystem is at most one pull request a week.
#
# Cargo: an update can lift the Rust 1.88 floor (.agent/reference/rust-crates.md, "Toolchain
# floor"). Nothing is held back for it: the msrv job in ci.yml builds the workspace with a real
# Rust 1.88.0, so read its result before merging a cargo update.
#
# npm: web/ is a pnpm workspace (pnpm-lock.yaml); Dependabot's npm ecosystem reads pnpm lockfiles.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    # No floor pins to ignore: the msrv job at 1.88 is what catches an update that lifts it.

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The Node types follow the Node we run (24, engines in web/package.json); raise them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A TypeScript major (7 is the native compiler) is its own change, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
